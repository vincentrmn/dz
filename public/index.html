<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub Rapport Technique — DZ Construct</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/logo-dz.png">
</head>
<body>
  <header>
    <a href="/" style="display:flex;align-items:center;"><img src="/logo-dz.png" alt="DZ Construct"></a>
    <div class="titre">Hub Rapport Technique</div>
    <nav>
      <a href="/" class="actif">Dashboard</a>
      <a href="/rapports">Rapports</a>
      <a href="/configuration">Configuration</a>
      <a href="/debug">Debug</a>
    </nav>
  </header>

  <main>
    <div id="bandeau"></div>

    <h2>Chantiers</h2>
    <div class="barre-outils">
      <div class="selecteur-periode">
        <div class="segmente">
          <button id="mode-semaine" class="seg actif">Semaine</button>
          <button id="mode-libre" class="seg">Période libre</button>
        </div>
        <div class="zone-sem" id="zone-semaine">
          <button class="fleche" id="sem-prec" title="Semaine précédente">‹</button>
          <div class="sem-label" id="sem-label"></div>
          <button class="fleche" id="sem-suiv" title="Semaine suivante">›</button>
        </div>
        <div class="zone-libre" id="zone-libre" style="display:none">
          <input type="date" id="d-debut" title="Premier jour du rapport">
          <span style="color: var(--gris);">→</span>
          <input type="date" id="d-fin" title="Dernier jour du rapport">
        </div>
      </div>
      <div class="a-droite">
        <button id="btn-decouverte" title="Scanner les conversations Teams pour détecter de nouveaux chantiers" style="display:inline-flex;align-items:center;gap:7px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Scan des nouveaux chantiers</button>
        <button id="btn-ajouter">+ Ajouter un chantier</button>
      </div>
    </div>
    <div id="chantiers"><div class="vide">Chargement…</div></div>

    <h2 id="rapports">Derniers rapports</h2>
    <div id="liste-rapports"><div class="vide">Chargement…</div></div>
    <p style="margin-top: 12px;"><a href="/rapports" style="color: var(--rouge); font-size: 14px; font-weight: 600; text-decoration: none;">Tous les rapports, classés par chantier →</a></p>
  </main>

  <div class="toast" id="toast"></div>
  <footer>
    <div class="pied-page">
      <span>© 2026 <strong>DZ Construct S.A.</strong> — Tous droits réservés</span>
      <span>173, Route de Belvaux · L-4026 Esch-sur-Alzette</span>
    </div>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
